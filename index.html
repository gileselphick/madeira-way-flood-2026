  /* PIN overlay */
  #pin-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);

  /* Gallery */

    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));

    padding: 15px;
  }

  .gallery img, .gallery video {

<script>
  const correctPin = "3434";  // Replace with your PIN

  const pinOverlay = document.getElementById("pin-overlay");
  const pinInput = document.getElementById("pin-input");
  const pinSubmit = document.getElementById("pin-submit");
  const pinError = document.getElementById("pin-error");

  function unlock() {
    sessionStorage.setItem("pinValidated", "true");
    pinOverlay.style.display = "none";
  }

  function handlePinSubmit() {
    const entered = pinInput.value.trim();
    if (!entered) {
      pinError.textContent = "Please enter a PIN.";
      return;
    }

    if (entered === correctPin) {
      unlock();
    } else {
      pinError.textContent = "Incorrect PIN.";
    }
  }

  pinSubmit.addEventListener("click", handlePinSubmit);
  pinInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handlePinSubmit();
  });

  // Auto-unlock if already validated this session
  window.onload = function () {
    if (sessionStorage.getItem("pinValidated") === "true") {
      pinOverlay.style.display = "none";
    }
  };
</script>
